name: Quality and security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf php-cli php-sqlite3
      - name: Verify PHP SQLite runtime
        run: |
          php --version
          php -m
          php -r 'if (!extension_loaded("pdo_sqlite")) { fwrite(STDERR, "pdo_sqlite is unavailable\n"); exit(1); } new PDO("sqlite::memory:"); echo "pdo_sqlite runtime ready\n";'
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock
      - run: npm run build
      - run: npm run build:desktop
      - run: npm run build:apache
