[package]
name = "licentia"
version = "0.1.10"
description = "Offline SPDX license catalog and selection guide"
authors = ["Licentia contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "licentia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
